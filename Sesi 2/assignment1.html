<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 1</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      .calc-btn {
        width: 100%;
        padding-block: 1.5rem;
        font-size: 1.75rem;
        background: var(--bs-secondary-bg-subtle);
        border: 0;
        border-radius: 0;
      }

      .calc-btn:hover {
        background: var(--bs-success-bg-subtle);
      }

      .calc-btn-equals {
        height: 100%;
        font-size: 2rem;
        background: var(--bs-warning);
      }
    </style>
  </head>
  <body>
    <div class="container my-4">
      <div class="row g-2">
        <div class="col-12">
          <div class="bg-secondary text-white text-end p-4 fs-1" id="result">

          </div>
        </div>
      </div>

      <div class="row g-2 mt-0">
        <div class="col-3"><button type="button" class="btn calc-btn" id="ac">AC</button></div>
        <div class="col-3"><button type="button" class="btn calc-btn" id="ce">CE</button></div>
        <div class="col-3"><button type="button" class="btn calc-btn" id="divide">/</button></div>
        <div class="col-3"><button type="button" class="btn calc-btn" id="multiply">*</button></div>
      </div>

      <div class="row g-2 mt-0">
        <div class="col-3"><button type="button" class="btn calc-btn" id="seven">7</button></div>
        <div class="col-3"><button type="button" class="btn calc-btn" id="eight">8</button></div>
        <div class="col-3"><button type="button" class="btn calc-btn" id="nine">9</button></div>
        <div class="col-3"><button type="button" class="btn calc-btn" id="minus">-</button></div>
      </div>

      <div class="row g-2 mt-0">
        <div class="col-3"><button type="button" class="btn calc-btn" id="four">4</button></div>
        <div class="col-3"><button type="button" class="btn calc-btn" id="five">5</button></div>
        <div class="col-3"><button type="button" class="btn calc-btn" id="six">6</button></div>
        <div class="col-3"><button type="button" class="btn calc-btn" id="plus">+</button></div>
      </div>

      <div class="row g-2 mt-0">
        <div class="col-9">
          <div class="row g-2">
            <div class="col-4"><button type="button" class="btn calc-btn" id="one">1</button></div>
            <div class="col-4"><button type="button" class="btn calc-btn" id="two">2</button></div>
            <div class="col-4"><button type="button" class="btn calc-btn" id="three">3</button></div>
          </div>
          <div class="row g-2 mt-0">
            <div class="col-8"><button type="button" class="btn calc-btn" id="zero">0</button></div>
            <div class="col-4"><button type="button" class="btn calc-btn" id="dot">.</button></div>
          </div>
        </div>

        <div class="col-3 d-grid">
          <button type="button" class="btn calc-btn calc-btn-equals" id="equal">=</button>
        </div>
      </div>
    </div>

    <script src="assignment1.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
